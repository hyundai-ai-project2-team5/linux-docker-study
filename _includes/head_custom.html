<!-- 윈도우 터미널 기본 글꼴 Cascadia Mono -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cascadia-mono@5.2.3/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cascadia-mono@5.2.3/700.css">
<!-- 한글은 D2Coding (한글 범위에서만 쓰고, 굵은 글씨는 브라우저가 만들어요) -->
<style>
  @font-face {
    font-family: 'D2Coding';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: local('D2Coding'),
      url('https://cdn.jsdelivr.net/gh/joungkyun/font-d2coding@1.3.2/D2Coding.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/joungkyun/font-d2coding@1.3.2/D2Coding.woff') format('woff');
    unicode-range: U+1100-11FF, U+3130-318F, U+A960-A97F, U+AC00-D7A3, U+D7B0-D7FF;
  }
</style>
<!-- 사이드바 회차 메뉴에 Linux/Docker 칩을 붙일 때 쓰는 분야 정보 (sessions/NN.md의 field) -->
{%- assign study_posts = site.pages | where: "dir", "/sessions/" %}
<script>
  window.studyFields = { {%- for p in study_posts %}"{{ p.url | relative_url }}": "{{ p.field }}"{% unless forloop.last %}, {% endunless %}{%- endfor %} };
</script>
<script src="{{ '/assets/js/terminal.js' | relative_url }}" defer></script>
