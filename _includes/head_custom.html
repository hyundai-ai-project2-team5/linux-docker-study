<!-- Ubuntu 기본 고정폭 글꼴 Ubuntu Sans Mono (Ubuntu 23.10부터 기본) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans+Mono:wght@400;700&display=swap">
<!-- 한글과 사이드바 tree 가지 기호(├── │ └──, U+2500-257F)는 D2Coding (고정폭이라 칸이 맞아요). 굵은 글씨는 브라우저가 만들어요 -->
<style>
  @font-face {
    font-family: 'D2Coding';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: local('D2Coding'),
      url('https://cdn.jsdelivr.net/gh/joungkyun/font-d2coding@1.3.2/D2Coding.woff2') format('woff2'),
      url('https://cdn.jsdelivr.net/gh/joungkyun/font-d2coding@1.3.2/D2Coding.woff') format('woff');
    unicode-range: U+1100-11FF, U+2500-257F, U+3130-318F, U+A960-A97F, U+AC00-D7A3, U+D7B0-D7FF;
  }
</style>
<!-- 탭 아이콘 (모두 assets/images/logo.png와 같은 그림, 검은 바탕)
  - favicon.ico(16·32·48px): 저장소 맨 위 파일이라 테마가 자동으로 넣어요
  - favicon-32.png: PNG를 먼저 쓰는 브라우저용 탭 아이콘
  - icon-192.png: 안드로이드 홈 화면·북마크 아이콘
  - apple-touch-icon.png(180px): 아이폰·아이패드 홈 화면 아이콘 -->
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/images/icon-192.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
<script src="{{ '/assets/js/terminal.js' | relative_url }}" defer></script>
