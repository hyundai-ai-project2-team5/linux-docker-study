title: Linux & Docker Study
description: 현대 AI Service 개발 2차 팀 5조 · 2026.11.24 ~ 12.22 · 화·목 18:00
lang: ko-KR

# GitHub Pages가 그대로 빌드해요 (설정 > Pages > Deploy from a branch > main / root)
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme

color_scheme: terminal   # 윈도우 터미널 Campbell 색 (_sass/color_schemes/terminal.scss)

search_enabled: true
heading_anchors: true
back_to_top: false # 페이지 맨 아래 "맨 위로" 링크를 쓰지 않아요
footer_content: "Linux &amp; Docker Study · 현대 AI Service 개발 2차 팀 5조"
aux_links:
  "팀 GitHub repository":
    - "https://github.com/hyundai-ai-project2-team5/linux-docker-study"
aux_links_new_tab: true

exclude:
  - README.md

# 댓글(giscus) 설정: 저장소를 만든 뒤 https://giscus.app 에서 값을 받아 채워요 (팀 Notion 작성 방법 참고)
giscus:
  repo: "hyundai-ai-project2-team5/linux-docker-study"
  repo_id: "R_kgDOVzwAmQ"
  category: "Comments"
  category_id: "DIC_kwDOVzwAmc4DLdrp"

defaults:
  - scope:
      path: "notes"
    values:
      layout: note
      nav_exclude: true
  - scope:
      path: "quiz"
    values:
      layout: quiz
      nav_exclude: true
      search_exclude: true
  - scope:
      path: "sessions"
    values:
      layout: post
      parent: Linux와 Docker 톺아보기
